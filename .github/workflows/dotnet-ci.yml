name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SmartHome.API/SmartHome.API.slnx

      - name: Build
        run: dotnet build SmartHome.API/SmartHome.API.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SmartHome.API/SmartHome.API.slnx --no-build --configuration Release --verbosity normal